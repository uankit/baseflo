[project]
name = "connectors"
version = "0.1.0"
description = "Data source connectors for Baseflo"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["connectors"]
