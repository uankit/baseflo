[project]
name = "baseflo"
version = "2.0.0"
description = "Baseflo Brain — autonomous business intelligence"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pydantic-ai>=0.0.52",
    "httpx>=0.28",
    "python-jose[cryptography]>=3.4",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.20",
    "email-validator>=2.2",
    "structlog>=25.1",
    "redis>=5.2",
    "arq>=0.26",
    "numpy>=2.2",
    "pandas>=2.2",
    "scipy>=1.15",
    "gspread>=6.2",
    "google-auth>=2.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-anyio>=0.0",
    "httpx>=0.28",
    "ruff>=0.11",
    "mypy>=1.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
